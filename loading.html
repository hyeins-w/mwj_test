<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fcfbf9">
    <title>명월재 심층사주 - 결과 준비 중</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
        @font-face{font-family:'MaruBuri';src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2);font-weight:600;font-display:swap;}
        @font-face{font-family:'MaruBuri';src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2);font-weight:700;font-display:swap;}
        @font-face{font-family:'JoseonPalace';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGs.woff') format('woff');font-weight:normal;font-display:swap;}
    </style>
    <style>
        :root{--navy:#0D253B;--gold:#c0944d;--gold-deep:#96631c;--paper:#fcfbf9;--ink:#333244;--ink-soft:#79768a;}
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;overscroll-behavior:none;}
        body{
            font-family:'Pretendard Variable',sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;
            background-image:url(./img/main/sec_bg.webp);background-size:cover;background-position:center;
        }

        .load{
            position:relative;width:100%;max-width:800px;margin:auto;
            height:100vh;height:calc(var(--vh,1vh) * 100);
            container-type:size;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            transition:opacity .5s ease;
        }

        .load_logo{width:22cqmin;max-width:170px;display:block;margin-bottom:7%;opacity:0;animation:fadeIn .9s ease forwards .1s;}

        .ring{position:relative;width:22cqmin;height:22cqmin;margin-bottom:8%;opacity:0;animation:fadeIn .9s ease forwards .3s;}
        .ring_line{position:absolute;inset:0;border-radius:50%;border:1px solid #c0944d4d;animation:spin 40s linear infinite;}
        .ring_line span{
            position:absolute;top:50%;left:50%;width:1.8em;margin-left:-0.9em;text-align:center;
            font-family:'JoseonPalace';font-size:1.7cqmin;color:var(--gold-deep);opacity:.8;
            transform:translate(-50%,-50%) rotate(calc(30deg * var(--i))) translateY(-10.6cqmin) rotate(calc(-30deg * var(--i)));
        }
        .ring_core{
            position:absolute;inset:28%;border-radius:50%;
            background:radial-gradient(circle at 34% 28%, #fffdf8 0%, #f3e4c6 55%, #ddc18b 100%);
            border:1px solid #c0944d;box-shadow:0 0 3cqmin #c0944d40;
            display:flex;align-items:center;justify-content:center;
            animation:breathe 2.8s ease-in-out infinite;
        }
        .ring_core::after{content:"命";font-family:'JoseonPalace';font-size:6cqmin;color:var(--gold-deep);}

        .load_tit{font-family:'MaruBuri';font-weight:700;font-size:4.4cqmin;color:var(--navy);text-align:center;line-height:1.45;margin-bottom:2.5%;opacity:0;animation:fadeUp .8s ease forwards .45s;}

        .load_step{height:2.6em;position:relative;width:86%;opacity:0;animation:fadeIn .8s ease forwards .6s;}
        .load_step p{
            position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:2.5cqmin;font-weight:500;color:var(--ink-soft);text-align:center;
            opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease;
        }
        .load_step p.on{opacity:1;transform:translateY(0);}

        .bar{width:70%;max-width:340px;display:flex;align-items:center;gap:3%;opacity:0;animation:fadeIn .8s ease forwards .7s;}
        .bar_track{flex:1;height:0.24em;font-size:2.4cqmin;background:#c0944d26;border-radius:5em;overflow:hidden;}
        .bar_fill{height:100%;width:0%;border-radius:5em;background:linear-gradient(90deg,var(--navy) 0%,var(--gold) 100%);transition:width .35s ease;}
        .bar_pct{font-size:2.3cqmin;font-weight:700;color:var(--navy);width:3em;text-align:right;font-variant-numeric:tabular-nums;}

        .load_note{margin-top:6%;font-size:1.9cqmin;color:#a09a8d;font-weight:500;opacity:0;animation:fadeIn .8s ease forwards .85s;}

        @keyframes spin{to{transform:rotate(360deg);}}
        @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
        @keyframes fadeIn{to{opacity:1;}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
        @media (prefers-reduced-motion: reduce){
            .ring_line,.ring_core{animation:none!important;}
        }
        @media (max-height:460px){
            .load_logo{margin-bottom:3%;}
            .ring{width:15cqmin;height:15cqmin;margin-bottom:4%;}
            .ring_line span{transform:translate(-50%,-50%) rotate(calc(30deg * var(--i))) translateY(-7.2cqmin) rotate(calc(-30deg * var(--i)));}
            .load_note{margin-top:3%;}
        }
    </style>
</head>
<body>

    <div class="load" id="load">
        <img class="load_logo" src="./img/main/logo.webp" alt="명월재">

        <div class="ring">
            <div class="ring_line">
                <span style="--i:0">子</span><span style="--i:1">丑</span><span style="--i:2">寅</span>
                <span style="--i:3">卯</span><span style="--i:4">辰</span><span style="--i:5">巳</span>
                <span style="--i:6">午</span><span style="--i:7">未</span><span style="--i:8">申</span>
                <span style="--i:9">酉</span><span style="--i:10">戌</span><span style="--i:11">亥</span>
            </div>
            <div class="ring_core"></div>
        </div>

        <h1 class="load_tit">당신의 사주를<br>풀이하고 있습니다</h1>

        <div class="load_step" id="steps">
            <p>사주 원국을 세우는 중입니다</p>
            <p>오행의 균형을 살피는 중입니다</p>
            <p>대운과 세운의 흐름을 읽는 중입니다</p>
            <p>21인의 해석을 대조하는 중입니다</p>
            <p>해설서를 정리하는 중입니다</p>
        </div>

        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="사주 분석 진행률">
            <div class="bar_track"><div class="bar_fill" id="barFill"></div></div>
            <span class="bar_pct" id="barPct">0%</span>
        </div>

        <p class="load_note">완료되면 자동으로 넘어갑니다</p>
    </div>

    <script>
        /* ▼ 다음 페이지 : loading.html?next=result_paid.html 처럼 지정 */
        var NEXT_URL = new URLSearchParams(location.search).get('next') || 'result_free.html';
        /* ▼ 실제 API 연동 시 false 로 두고, 응답 도착 시 mwjLoadingComplete(NEXT_URL) 호출 */
        var AUTO_COMPLETE = true;
        var DURATION = 6000;

        function setVh(){ document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px'); }
        setVh();
        window.addEventListener('resize', setVh);
        window.addEventListener('orientationchange', setVh);

        var root = document.getElementById('load');
        var steps = document.querySelectorAll('#steps p');
        var fill = document.getElementById('barFill');
        var pct = document.getElementById('barPct');
        var wrap = document.querySelector('[role="progressbar"]');
        var cur = -1, finished = false, rafId = null;

        function setProgress(v){
            v = Math.max(0, Math.min(100, Math.round(v)));
            fill.style.width = v + '%';
            pct.textContent = v + '%';
            wrap.setAttribute('aria-valuenow', v);

            var idx = Math.min(Math.floor((v / 100) * steps.length), steps.length - 1);
            if(idx !== cur){
                if(cur >= 0) steps[cur].classList.remove('on');
                steps[idx].classList.add('on');
                cur = idx;
            }
        }
        setProgress(0);

        var start = null;
        function frame(ts){
            if(!start) start = ts;
            var p = Math.min((ts - start) / DURATION, 1);
            setProgress((1 - Math.pow(1 - p, 2.2)) * (AUTO_COMPLETE ? 100 : 92));
            if(p < 1) rafId = requestAnimationFrame(frame);
            else if(AUTO_COMPLETE) window.mwjLoadingComplete(NEXT_URL);
        }
        rafId = requestAnimationFrame(frame);

        /* 실제 연동 훅 : 응답 도착 시 호출 — mwjLoadingComplete('result_paid.html') */
        window.mwjLoadingComplete = function(redirectUrl){
            if(finished) return;
            finished = true;
            if(rafId) cancelAnimationFrame(rafId);
            setProgress(100);
            setTimeout(function(){
                root.style.opacity = '0';
                setTimeout(function(){ if(redirectUrl) location.href = redirectUrl; }, 520);
            }, 400);
        };
    </script>
</body>
</html>
